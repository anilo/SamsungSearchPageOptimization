<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    width: 220px;
    padding: 12px;
    font-family: sans-serif;
    color: #111;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 10px;
  }
  button {
    display: block;
    width: 100%;
    margin-bottom: 6px;
    padding: 10px;
    border: 1px solid #bbb;
    border-radius: 6px;
    background: #fff;
    font: 600 14px sans-serif;
    text-align: left;
    cursor: pointer;
  }
  button.active {
    border-color: #e00000;
    background: #fff0f0;
    color: #e00000;
  }
  button:hover { background: #f4f4f4; }
  p {
    margin: 8px 0 0;
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>
<h1>Layout version</h1>
<button data-version="a">Version A</button>
<button data-version="b">Version B</button>
<button data-version="c">Version C</button>
<button data-version="off">Original page</button>
<p>Choosing a version reloads the Samsung All Smartphones tab.</p>
<script src="popup.js"></script>
</body>
</html>
